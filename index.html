<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON STREET FASHION | Official Store</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
            background-color: #0b0c10;
            color: #e0e0e0;
        }
        .font-brand { font-family: 'Cinzel', serif; }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFE57F 0%, #D4AF37 50%, #AA7C11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            color: #000;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            background: linear-gradient(135deg, #FFE57F 0%, #D4AF37 100%:;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .gold-card {
            background: #12141c;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const defaultSettings = {
            bkashNumber: "01700000000",
            nagadNumber: "01800000000",
            rocketNumber: "01900000000",
            deliveryInside: 60,
            deliveryOutside: 120
        };

        const defaultProducts = [
            {
                id: 1,
                name: "IRON Classic Heavy Hoodie",
                category: "Hoodies",
                price: 1850,
                originalPrice: 2400,
                discount: "23%",
                image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80",
                sizes: { "S": 5, "M": 10, "L": 8, "XL": 5, "XXL": 2 },
                description: "Premium heavy cotton oversized hoodie designed for ultimate streetwear luxury."
            },
            {
                id: 2,
                name: "Gold Embossed Drop-Shoulder Tee",
                category: "T-Shirts",
                price: 950,
                originalPrice: 1350,
                discount: "30%",
                image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=800&q=80",
                sizes: { "S": 10, "M": 15, "L": 12, "XL": 0, "XXL": 0 },
                description: "100% Organic combed cotton t-shirt featuring signature gold foil embossing."
            }
        ];

        function App() {
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('iron_products_v3');
                return saved ? JSON.parse(saved) : defaultProducts;
            });

            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('iron_orders_v3');
                return saved ? JSON.parse(saved) : [];
            });

            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('iron_settings_v3');
                return saved ? JSON.parse(saved) : defaultSettings;
            });

            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [adminTab, setAdminTab] = useState('orders'); // 'orders', 'products', 'settings'

            // New Product Form State
            const [newProduct, setNewProduct] = useState({
                name: '', category: 'T-Shirts', price: '', originalPrice: '',
                image: '', desc: '', stockS: 5, stockM: 5, stockL: 5, stockXL: 5, stockXXL: 2
            });

            // Express Checkout State
            const [expressProduct, setExpressProduct] = useState(null);
            const [selectedSize, setSelectedSize] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('cod'); // 'cod', 'bkash', 'nagad', 'rocket'
            const [trxId, setTrxId] = useState('');
            const [customerPhoneForBkash, setCustomerPhoneForBkash] = useState('');

            const [checkoutForm, setCheckoutForm] = useState({
                name: '', phone: '', address: '', location: 'inside'
            });

            // Tracking
            const [trackingIdInput, setTrackingIdInput] = useState('');
            const [trackedOrder, setTrackedOrder] = useState(null);

            useEffect(() => {
                localStorage.setItem('iron_products_v3', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('iron_orders_v3', JSON.stringify(orders));
            }, [orders]);

            useEffect(() => {
                localStorage.setItem('iron_settings_v3', JSON.stringify(settings));
            }, [settings]);

            const scrollToProducts = () => {
                document.getElementById('products-section')?.scrollIntoView({ behavior: 'smooth' });
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewProduct({ ...newProduct, image: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddProduct = (e) => {
                e.preventDefault();
                const item = {
                    id: Date.now(),
                    name: newProduct.name,
                    category: newProduct.category,
                    price: Number(newProduct.price),
                    originalPrice: newProduct.originalPrice ? Number(newProduct.originalPrice) : null,
                    discount: newProduct.originalPrice ? `${Math.round(((newProduct.originalPrice - newProduct.price) / newProduct.originalPrice) * 100)}%` : null,
                    image: newProduct.image || "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80",
                    sizes: {
                        "S": Number(newProduct.stockS),
                        "M": Number(newProduct.stockM),
                        "L": Number(newProduct.stockL),
                        "XL": Number(newProduct.stockXL),
                        "XXL": Number(newProduct.stockXXL)
                    },
                    description: newProduct.desc
                };

                setProducts([item, ...products]);
                alert('নতুন প্রোডাক্ট যুক্ত হয়েছে!');
                setNewProduct({ name: '', category: 'T-Shirts', price: '', originalPrice: '', image: '', desc: '', stockS: 5, stockM: 5, stockL: 5, stockXL: 5, stockXXL: 2 });
            };

            const handleDeleteProduct = (id) => {
                if (confirm('প্রোডাক্টটি ডিলিট করতে চান?')) {
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            const handleOrderStatusChange = (orderId, newStatus) => {
                setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
            };

            const openExpressCheckout = (product) => {
                setExpressProduct(product);
                const availableSizes = Object.keys(product.sizes).filter(s => product.sizes[s] > 0);
                setSelectedSize(availableSizes.length > 0 ? availableSizes[0] : '');
            };

            const handlePlaceOrder = (e) => {
                e.preventDefault();
                if (!selectedSize) return alert('অনুগ্রহ করে সাইজ নির্বাচন করুন!');
                if (paymentMethod !== 'cod' && (!trxId.trim() || !customerPhoneForBkash.trim())) {
                    return alert('পেমেন্ট এরিয়া থেকে আপনার নম্বর ও Transaction ID দিন!');
                }

                const deliveryFee = checkoutForm.location === 'inside' ? Number(settings.deliveryInside) : Number(settings.deliveryOutside);
                const totalAmount = expressProduct.price + deliveryFee;
                const orderId = 'IRN-' + Math.floor(100000 + Math.random() * 900000);

                const newOrder = {
                    id: orderId,
                    productName: expressProduct.name,
                    price: expressProduct.price,
                    size: selectedSize,
                    customerName: checkoutForm.name,
                    phone: checkoutForm.phone,
                    address: checkoutForm.address,
                    deliveryArea: checkoutForm.location === 'inside' ? 'ঢাকার ভেতরে' : 'ঢাকার বাইরে',
                    deliveryFee,
                    totalAmount,
                    paymentMethod: paymentMethod.toUpperCase(),
                    paymentPhone: customerPhoneForBkash,
                    trxId: trxId,
                    status: 'Pending',
                    date: new Date().toLocaleDateString('bn-BD')
                };

                // Stock deduction
                const updatedProducts = products.map(p => {
                    if (p.id === expressProduct.id) {
                        return {
                            ...p,
                            sizes: {
                                ...p.sizes,
                                [selectedSize]: Math.max(0, p.sizes[selectedSize] - 1)
                            }
                        };
                    }
                    return p;
                });

                setProducts(updatedProducts);
                setOrders([newOrder, ...orders]);
                alert(`ধন্যবাদ! আপনার অর্ডারটি গ্রহণ করা হয়েছে।\nট্র্যাকিং আইডি: ${orderId}`);
                setExpressProduct(null);
                setTrxId('');
                setCustomerPhoneForBkash('');
                setCheckoutForm({ name: '', phone: '', address: '', location: 'inside' });
            };

            const handleTrackOrder = (e) => {
                e.preventDefault();
                const found = orders.find(o => o.id.toLowerCase() === trackingIdInput.trim().toLowerCase());
                if (found) setTrackedOrder(found);
                else {
                    alert('কোনো অর্ডার পাওয়া যায়নি!');
                    setTrackedOrder(null);
                }
            };

            const totalRevenue = orders.reduce((acc, curr) => acc + curr.totalAmount, 0);

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-yellow-600/30 px-4 py-3">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl md:text-2xl font-black font-brand tracking-wider gold-gradient-text">
                                IRON STREET FASHION
                            </h1>
                            <button 
                                onClick={() => setIsAdminOpen(true)}
                                className="text-xs bg-yellow-600/20 text-yellow-400 border border-yellow-600/50 px-3 py-1.5 rounded-full hover:bg-yellow-600 hover:text-black transition"
                            >
                                🔑 Admin Panel
                            </button>
                        </div>
                    </header>

                    {/* Banner */}
                    <div onClick={scrollToProducts} className="cursor-pointer relative bg-gradient-to-r from-black via-zinc-900 to-black py-16 px-4 border-b border-yellow-600/20 text-center">
                        <span className="text-xs tracking-widest text-yellow-500 uppercase font-semibold">Luxury Streetwear Bangladesh</span>
                        <h2 className="text-3xl md:text-5xl font-extrabold font-brand my-3 text-white">NEW DROP ARRIVED</h2>
                        <p className="text-gray-400 text-sm max-w-xl mx-auto mb-6">প্রিমিয়াম কোয়ালিটি স্ট্রিটওয়্যার কালেকশন। ক্লিক করে সব প্রোডাক্ট দেখুন।</p>
                        <button className="gold-btn px-6 py-2 rounded-full text-xs font-bold">🔥 কালেকশন দেখুন</button>
                    </div>

                    {/* Main Shop */}
                    <main id="products-section" className="max-w-6xl mx-auto px-4 py-12">
                        <h3 className="text-xl font-bold font-brand text-center mb-8 gold-gradient-text">ALL PRODUCTS</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {products.map(product => {
                                const totalStock = Object.values(product.sizes).reduce((a, b) => a + b, 0);
                                return (
                                    <div key={product.id} className="gold-card rounded-xl overflow-hidden flex flex-col justify-between p-4">
                                        <div>
                                            <div className="relative h-60 overflow-hidden rounded-lg bg-zinc-800 mb-3">
                                                <img src={product.image} className="w-full h-full object-cover" />
                                                {product.discount && <span className="absolute top-2 left-2 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded">-{product.discount}</span>}
                                            </div>
                                            <h4 className="font-bold text-white text-base mb-1">{product.name}</h4>
                                            <p className="text-gray-400 text-xs mb-3">{product.description}</p>
                                            <div className="flex items-center space-x-2 mb-3">
                                                <span className="text-lg font-bold text-yellow-400">৳{product.price}</span>
                                                {product.originalPrice && <span className="text-xs text-gray-500 line-through">৳{product.originalPrice}</span>}
                                            </div>
                                        </div>
                                        <div>
                                            <div className="text-[11px] text-gray-400 mb-3 flex flex-wrap gap-1">
                                                {Object.entries(product.sizes).map(([sz, qty]) => (
                                                    <span key={sz} className={`px-1.5 py-0.5 rounded border ${qty > 0 ? 'border-green-800 text-green-400' : 'border-red-900 text-red-500 line-through'}`}>
                                                        {sz}: {qty}
                                                    </span>
                                                ))}
                                            </div>
                                            <button 
                                                disabled={totalStock <= 0}
                                                onClick={() => openExpressCheckout(product)}
                                                className={`w-full py-2 rounded-lg font-bold text-xs ${totalStock > 0 ? 'gold-btn' : 'bg-zinc-800 text-gray-600 cursor-not-allowed'}`}
                                            >
                                                {totalStock > 0 ? '⚡ Buy Now' : 'Out of Stock'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* Order Tracking */}
                    <div className="max-w-md mx-auto px-4 py-6">
                        <div className="gold-card p-5 rounded-xl text-center">
                            <h4 className="text-sm font-bold gold-gradient-text mb-2">অর্ডার স্ট্যাটাস চেক</h4>
                            <form onSubmit={handleTrackOrder} className="flex gap-2">
                                <input 
                                    type="text" 
                                    placeholder="Order ID (e.g. IRN-123456)" 
                                    value={trackingIdInput}
                                    onChange={(e) => setTrackingIdInput(e.target.value)}
                                    className="flex-1 bg-black border border-zinc-700 rounded px-3 py-1.5 text-xs text-white"
                                    required
                                />
                                <button type="submit" className="gold-btn px-3 py-1.5 rounded text-xs font-bold">ট্র্যাক</button>
                            </form>
                            {trackedOrder && (
                                <div className="mt-3 p-3 bg-zinc-900 rounded text-left text-xs space-y-1">
                                    <p><strong>আইডি:</strong> {trackedOrder.id}</p>
                                    <p><strong>প্রোডাক্ট:</strong> {trackedOrder.productName} ({trackedOrder.size})</p>
                                    <p><strong>পেমেন্ট পদ্ধতি:</strong> {trackedOrder.paymentMethod}</p>
                                    <p><strong>স্ট্যাটাস:</strong> <span className="text-yellow-400 font-bold">{trackedOrder.status}</span></p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Express Modal */}
                    {expressProduct && (
                        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                            <div className="gold-card max-w-md w-full rounded-xl p-5 relative max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setExpressProduct(null)} className="absolute top-3 right-3 text-gray-400">✕</button>
                                <h3 className="text-sm font-bold gold-gradient-text mb-3">⚡ সরাসরি অর্ডার করুন</h3>
                                <form onSubmit={handlePlaceOrder} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-gray-400 mb-1">সাইজ বেছে নিন:</label>
                                        <div className="flex gap-2 flex-wrap">
                                            {Object.entries(expressProduct.sizes).map(([sz, qty]) => (
                                                <button
                                                    key={sz}
                                                    type="button"
                                                    disabled={qty <= 0}
                                                    onClick={() => setSelectedSize(sz)}
                                                    className={`px-3 py-1 rounded font-bold border ${selectedSize === sz ? 'bg-yellow-500 text-black' : qty > 0 ? 'border-zinc-700' : 'border-zinc-800 text-gray-600 line-through'}`}
                                                >
                                                    {sz}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <input type="text" placeholder="আপনার নাম" value={checkoutForm.name} onChange={(e) => setCheckoutForm({...checkoutForm, name: e.target.value})} className="w-full bg-black border border-zinc-700 rounded p-2 text-white" required />
                                    <input type="tel" placeholder="মোবাইল নম্বর" value={checkoutForm.phone} onChange={(e) => setCheckoutForm({...checkoutForm, phone: e.target.value})} className="w-full bg-black border border-zinc-700 rounded p-2 text-white" required />
                                    <textarea placeholder="সম্পূর্ণ ঠিকানা" value={checkoutForm.address} onChange={(e) => setCheckoutForm({...checkoutForm, address: e.target.value})} className="w-full bg-black border border-zinc-700 rounded p-2 text-white h-16" required></textarea>
                                    
                                    <div>
                                        <label className="block text-gray-400 mb-1">ডেলিভারি এলাকা:</label>
                                        <select value={checkoutForm.location} onChange={(e) => setCheckoutForm({...checkoutForm, location: e.target.value})} className="w-full bg-black border border-zinc-700 rounded p-2 text-white">
                                            <option value="inside">ঢাকার ভেতরে (৳{settings.deliveryInside})</option>
                                            <option value="outside">ঢাকার বাইরে (৳{settings.deliveryOutside})</option>
                                        </select>
                                    </div>

                                    {/* Payment Options */}
                                    <div>
                                        <label className="block text-gray-400 mb-1">পেমেন্ট মেথড:</label>
                                        <div className="grid grid-cols-3 gap-2 mb-2">
                                            <button type="button" onClick={() => setPaymentMethod('cod')} className={`p-2 rounded border text-center font-bold ${paymentMethod === 'cod' ? 'border-yellow-500 text-yellow-400 bg-yellow-500/10' : 'border-zinc-800'}`}>
                                                COD (ক্যাশ অন)
                                            </button>
                                            <button type="button" onClick={() => setPaymentMethod('bkash')} className={`p-2 rounded border text-center font-bold ${paymentMethod === 'bkash' ? 'border-pink-500 text-pink-400 bg-pink-500/10' : 'border-zinc-800'}`}>
                                                bKash (বিকাশ)
                                            </button>
                                            <button type="button" onClick={() => setPaymentMethod('nagad')} className={`p-2 rounded border text-center font-bold ${paymentMethod === 'nagad' ? 'border-orange-500 text-orange-400 bg-orange-500/10' : 'border-zinc-800'}`}>
                                                Nagad (নগদ)
                                            </button>
                                        </div>

                                        {paymentMethod === 'bkash' && (
                                            <div className="bg-pink-950/30 p-3 rounded border border-pink-500/30 space-y-2">
                                                <p className="text-[11px] text-pink-300">বিকাশ পার্সোনাল নম্বর: <strong>{settings.bkashNumber}</strong> (Send Money)</p>
                                                <input type="tel" placeholder="যে বিকাশ নম্বর থেকে টাকা পাঠিয়েছেন" value={customerPhoneForBkash} onChange={(e) => setCustomerPhoneForBkash(e.target.value)} className="w-full bg-black border border-zinc-700 rounded p-1.5 text-white" required />
                                                <input type="text" placeholder="bKash TrxID (Transaction ID)" value={trxId} onChange={(e) => setTrxId(e.target.value)} className="w-full bg-black border border-zinc-700 rounded p-1.5 text-white" required />
                                            </div>
                                        )}

                                        {paymentMethod === 'nagad' && (
                                            <div className="bg-orange-950/30 p-3 rounded border border-orange-500/30 space-y-2">
                                                <p className="text-[11px] text-orange-300">নগদ পার্সোনাল নম্বর: <strong>{settings.nagadNumber}</strong> (Send Money)</p>
                                                <input type="tel" placeholder="যে নগদ নম্বর থেকে টাকা পাঠিয়েছেন" value={customerPhoneForBkash} onChange={(e) => setCustomerPhoneForBkash(e.target.value)} className="w-full bg-black border border-zinc-700 rounded p-1.5 text-white" required />
                                                <input type="text" placeholder="Nagad TrxID (Transaction ID)" value={trxId} onChange={(e) => setTrxId(e.target.value)} className="w-full bg-black border border-zinc-700 rounded p-1.5 text-white" required />
                                            </div>
                                        )}
                                    </div>

                                    <button type="submit" className="w-full gold-btn py-2 rounded font-bold text-xs">
                                        অর্ডার কনফার্ম করুন (৳{expressProduct.price + (checkoutForm.location === 'inside' ? Number(settings.deliveryInside) : Number(settings.deliveryOutside))})
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Admin Modal */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="gold-card max-w-3xl w-full rounded-xl p-5 relative max-h-[90vh] overflow-y-auto text-xs">
                                <button onClick={() => setIsAdminOpen(false)} className="absolute top-3 right-3 text-gray-400">✕</button>
                                
                                {!isAdminAuthenticated ? (
                                    <form onSubmit={(e) => { e.preventDefault(); adminPassword === '123456' ? setIsAdminAuthenticated(true) : alert('ভুল পাসওয়ার্ড'); }} className="max-w-xs mx-auto text-center py-6">
                                        <h3 className="text-base font-bold gold-gradient-text mb-3">অ্যাডমিন পাসওয়ার্ড (123456)</h3>
                                        <input type="password" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} className="w-full bg-black border border-zinc-700 rounded p-2 text-center text-white mb-3" placeholder="পাসওয়ার্ড দিন" required />
                                        <button type="submit" className="w-full gold-btn py-2 rounded font-bold">লগইন</button>
                                    </form>
                                ) : (
                                    <div>
                                        <div className="grid grid-cols-2 gap-2 mb-4 bg-zinc-900 p-3 rounded">
                                            <div><span className="text-gray-400">মোট সেলস:</span> <strong className="text-yellow-400">৳{totalRevenue}</strong></div>
                                            <div><span className="text-gray-400">মোট অর্ডার:</span> <strong className="text-white">{orders.length}</strong></div>
                                        </div>

                                        <div className="flex gap-4 border-b border-zinc-800 pb-3 mb-4 overflow-x-auto">
                                            <button onClick={() => setAdminTab('orders')} className={`font-bold whitespace-nowrap ${adminTab === 'orders' ? 'text-yellow-400 border-b-2 border-yellow-400' : 'text-gray-400'}`}>অর্ডারস ({orders.length})</button>
                                            <button onClick={() => setAdminTab('products')} className={`font-bold whitespace-nowrap ${adminTab === 'products' ? 'text-yellow-400 border-b-2 border-yellow-400' : 'text-gray-400'}`}>প্রোডাক্টস ও সাইজ স্টক</button>
                                            <button onClick={() => setAdminTab('settings')} className={`font-bold whitespace-nowrap ${adminTab === 'settings' ? 'text-yellow-400 border-b-2 border-yellow-400' : 'text-gray-400'}`}>স্টোর সেটিংস</button>
                                        </div>

                                        {adminTab === 'orders' && (
                                            <div className="space-y-3">
                                                {orders.map(o => (
                                                    <div key={o.id} className="bg-black p-3 rounded border border-zinc-800 space-y-1">
                                                        <div className="flex justify-between text-yellow-400 font-bold">
                                                            <span>{o.id} - {o.date}</span>
                                                            <span>৳{o.totalAmount} ({o.paymentMethod})</span>
                                                        </div>
                                                        <p><strong>আইটেম:</strong> {o.productName} (Size: {o.size})</p>
                                                        <p><strong>কাস্টমার:</strong> {o.customerName} ({o.phone})</p>
                                                        <p><strong>ঠিকানা:</strong> {o.address} ({o.deliveryArea})</p>
                                                        {o.trxId && <p className="text-pink-400"><strong>TrxID:</strong> {o.trxId} (নম্বর: {o.paymentPhone})</p>}
                                                        <div className="pt-2 flex items-center gap-2">
                                                            <span>স্ট্যাটাস:</span>
                                                            <select value={o.status} onChange={(e) => handleOrderStatusChange(o.id, e.target.value)} className="bg-zinc-800 text-yellow-400 p-1 rounded font-bold border border-zinc-700">
                                                                <option value="Pending">Pending</option>
                                                                <option value="Processing">Processing</option>
                                                                <option value="Shipped">Shipped</option>
                                                                <option value="Delivered">Delivered</option>
                                                                <option value="Cancelled">Cancelled</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTab === 'products' && (
                                            <div className="space-y-6">
                                                <form onSubmit={handleAddProduct} className="bg-black p-4 rounded border border-zinc-800 space-y-2">
                                                    <h4 className="font-bold text-yellow-400">নতুন প্রোডাক্ট যোগ করুন</h4>
                                                    <input type="text" placeholder="প্রোডাক্ট নাম" value={newProduct.name} onChange={(e) => setNewProduct({...newProduct, name: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" required />
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <input type="number" placeholder="বিক্রি মূল্য (৳)" value={newProduct.price} onChange={(e) => setNewProduct({...newProduct, price: e.target.value})} className="bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" required />
                                                        <input type="number" placeholder="আগের মূল্য (৳)" value={newProduct.originalPrice} onChange={(e) => setNewProduct({...newProduct, originalPrice: e.target.value})} className="bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" />
                                                    </div>
                                                    <div className="grid grid-cols-5 gap-1">
                                                        <div><label>S Stock:</label><input type="number" value={newProduct.stockS} onChange={(e) => setNewProduct({...newProduct, stockS: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1 rounded text-white" /></div>
                                                        <div><label>M Stock:</label><input type="number" value={newProduct.stockM} onChange={(e) => setNewProduct({...newProduct, stockM: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1 rounded text-white" /></div>
                                                        <div><label>L Stock:</label><input type="number" value={newProduct.stockL} onChange={(e) => setNewProduct({...newProduct, stockL: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1 rounded text-white" /></div>
                                                        <div><label>XL Stock:</label><input type="number" value={newProduct.stockXL} onChange={(e) => setNewProduct({...newProduct, stockXL: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1 rounded text-white" /></div>
                                                        <div><label>XXL Stock:</label><input type="number" value={newProduct.stockXXL} onChange={(e) => setNewProduct({...newProduct, stockXXL: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1 rounded text-white" /></div>
                                                    </div>
                                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full bg-zinc-900 border border-zinc-700 p-1 rounded text-white" />
                                                    <textarea placeholder="বিবরণ" value={newProduct.desc} onChange={(e) => setNewProduct({...newProduct, desc: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white h-12"></textarea>
                                                    <button type="submit" className="w-full gold-btn py-1.5 rounded font-bold">সেভ করুন</button>
                                                </form>

                                                <div className="space-y-2">
                                                    {products.map(p => (
                                                        <div key={p.id} className="flex justify-between items-center bg-black p-2 rounded border border-zinc-800">
                                                            <div>
                                                                <p className="font-bold text-white">{p.name}</p>
                                                                <p className="text-gray-400">৳{p.price} | S:{p.sizes.S}, M:{p.sizes.M}, L:{p.sizes.L}, XL:{p.sizes.XL}, XXL:{p.sizes.XXL}</p>
                                                            </div>
                                                            <button onClick={() => handleDeleteProduct(p.id)} className="bg-red-600 text-white px-2 py-1 rounded font-bold">ডিলিট</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {adminTab === 'settings' && (
                                            <div className="bg-black p-4 rounded border border-zinc-800 space-y-3">
                                                <h4 className="font-bold text-yellow-400">পেমেন্ট ও ডেলিভারি চার্জ সেটিং</h4>
                                                <div>
                                                    <label className="text-gray-400 block mb-1">বিকাশ পার্সোনাল নম্বর:</label>
                                                    <input type="text" value={settings.bkashNumber} onChange={(e) => setSettings({...settings, bkashNumber: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" />
                                                </div>
                                                <div>
                                                    <label className="text-gray-400 block mb-1">নগদ পার্সোনাল নম্বর:</label>
                                                    <input type="text" value={settings.nagadNumber} onChange={(e) => setSettings({...settings, nagadNumber: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" />
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div>
                                                        <label className="text-gray-400 block mb-1">ঢাকার ভেতর চার্জ (৳):</label>
                                                        <input type="number" value={settings.deliveryInside} onChange={(e) => setSettings({...settings, deliveryInside: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" />
                                                    </div>
                                                    <div>
                                                        <label className="text-gray-400 block mb-1">ঢাকার বাইরে চার্জ (৳):</label>
                                                        <input type="number" value={settings.deliveryOutside} onChange={(e) => setSettings({...settings, deliveryOutside: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 p-1.5 rounded text-white" />
                                                    </div>
                                                </div>
                                                <button onClick={() => alert('সেটিংস আপডেট হয়েছে!')} className="w-full gold-btn py-1.5 rounded font-bold">আপডেট করুন</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
